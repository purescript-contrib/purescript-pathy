package:
  name: pathy
  description: A type-safe abstraction for platform-independent file paths
  publish:
    version: 9.0.1
    license: Apache-2.0
    location:
      githubOwner: purescript-contrib
      githubRepo: purescript-pathy
  build:
    strict: true
  dependencies:
    - arrays: ">=7.0.0 <8.0.0"
    - either: ">=6.0.0 <7.0.0"
    - foldable-traversable: ">=6.0.0 <7.0.0"
    - gen: ">=4.0.0 <5.0.0"
    - identity: ">=6.0.0 <7.0.0"
    - lists: ">=7.0.0 <8.0.0"
    - maybe: ">=6.0.0 <7.0.0"
    - newtype: ">=5.0.0 <6.0.0"
    - nonempty: ">=7.0.0 <8.0.0"
    - partial: ">=4.0.0 <5.0.0"
    - prelude: ">=6.0.0 <7.0.0"
    - strings: ">=6.0.0 <7.0.0"
    - tailrec: ">=6.0.0 <7.0.0"
    - tuples: ">=7.0.0 <8.0.0"
    - typelevel-prelude: ">=7.0.0 <8.0.0"
    - unsafe-coerce: ">=6.0.0 <7.0.0"
  test:
    main: Test.Main
    dependencies:
      - console
      - effect
      - exceptions
      - quickcheck
workspace:
  packageSet:
    registry: 81.4.0
